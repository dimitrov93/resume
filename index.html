    <meta name="theme-color" content="#121212" />
    <!-- Apply the saved (or OS) theme and language before the first paint, so light-theme visitors don't see a dark flash. Mirrors useTheme/useLanguage. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', t)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#121212' : '#f5f5f5')
          var l = localStorage.getItem('lang')
          if (l !== 'bg' && l !== 'en') l = (navigator.languages || []).some(function (x) { return x.toLowerCase().indexOf('bg') === 0 }) ? 'bg' : 'en'
          document.documentElement.setAttribute('lang', l)
        } catch (e) {}
      })()
    </script>
